<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan CSS</title>
    <style>
        p{
            font-family: Georgia, 'Times New Roman', Times, serif;
            color: teal;
            font-weight: 500;
        }
        .momo {
            font-style: italic;
            color: maroon;
            font-family: 'Courier New', Courier, monospace;
        }
        .chiko {
            font-family: Arial, Helvetica, sans-serif;
            color: plum;
            font-size: x-large;
        }
    </style>
</head>
<body>
    <p style="font-weight: bold; color: hotpink;">ini adalah kalimat pertama</p>
    <p>ini adalah kalimat kedua</p>
    <p class="momo">ini adalah kalimat ketiga</p>
    <p class="chiko">ini adalah kalimat keempat</p>
</body>
</html>
